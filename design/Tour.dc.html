<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<div style="position:absolute; inset:0; pointer-events:none">
  <div onClick="{{ swallow }}" style="position:absolute; inset:0; pointer-events:auto; background:transparent"></div>
  <sc-if value="{{ hasTarget }}">
    <div aria-hidden="true" style="position:absolute; left:{{ hx }}; top:{{ hy }}; width:{{ hw }}; height:{{ hh }}; border-radius:7px; outline:2px solid var(--color-ink); outline-offset:2px; box-shadow:0 0 0 9999px rgb(10 12 14 / 0.38); transition:left 200ms cubic-bezier(0.2,0,0,1), top 200ms cubic-bezier(0.2,0,0,1), width 200ms cubic-bezier(0.2,0,0,1), height 200ms cubic-bezier(0.2,0,0,1)"></div>
  </sc-if>
  <sc-if value="{{ noTarget }}"><div aria-hidden="true" style="position:absolute; inset:0; background:rgb(10 12 14 / 0.38)"></div></sc-if>
  <div role="dialog" aria-modal="true" aria-labelledby="tour-title" aria-describedby="tour-body" style="{{ popStyle }}">
    <span style="font-size:13px; color:var(--color-text-secondary)">{{ stepLabel }}</span>
    <h2 id="tour-title" style="margin:0; font-size:16px; line-height:22px; font-weight:600">{{ title }}</h2>
    <p id="tour-body" style="margin:0; color:var(--color-text-secondary)">{{ body }}</p>
    <div style="display:flex; align-items:center; gap:8px; margin-top:4px">
      <button onClick="{{ skip }}" style="height:32px; padding:0 8px; border:none; border-radius:5px; background:transparent; color:var(--color-text-secondary); font-weight:500" style-hover="background:var(--color-surface-hover)">Skip tour</button>
      <span style="flex:1"></span>
      <sc-if value="{{ canBack }}"><button onClick="{{ back }}" style="height:32px; padding:0 12px; border-radius:5px; border:1px solid var(--color-border-strong); background:var(--color-surface); font-weight:500">Back</button></sc-if>
      <button ref="{{ nextRef }}" onClick="{{ next }}" style="height:32px; padding:0 14px; border-radius:5px; border:1px solid var(--color-ink); background:var(--color-ink); color:var(--color-on-ink); font-weight:600">{{ nextLabel }}</button>
    </div>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script>
class Component extends DCLogic {
  state = { r: null };
  nextRef = React.createRef();
  STEPS = [
    ['tiles', 'Summary and charts', 'The tiles and charts show what is working, what merged, and what it costs against your limits.'],
    ['needs', 'Needs you', 'Plans, approvals, conflicts, and failed checks that wait on you are listed here, oldest first.'],
    ['activity', 'Recent activity', 'Merges, CI results, approvals, and schedule runs from every project, as they happen.'],
    ['projects|projects-phone', 'Your projects', 'Each project has one board. Badges show what needs you, main branch CI, and awake agents.'],
    ['new-project|more-phone', 'Add a project', 'Add a repository folder or clone one from GitHub. Monorepos are detected for you.'],
    ['views|views-phone', 'Switch views', 'Inside a project, move between board, chats, agents, list, timeline, and calendar.'],
    ['search|more-phone', 'Search and shortcuts', 'Press Cmd or Ctrl and K to search actions, projects, cards, and settings.'],
    ['notices', 'Notices', 'Sleep warnings, CI failures, and cost warnings that happen while you are away.'],
    ['avatar', 'Your profile', 'Open your profile and settings, or replay this tour.']
  ];
  componentDidMount() {
    this.u = M.on(() => this.forceUpdate());
    this.kd = e => { if (!M.S.tour) return; if (e.key === 'Escape') { e.preventDefault(); this.end(); } else if (e.key === 'Enter' && !/INPUT|TEXTAREA/.test((document.activeElement || {}).tagName || '')) { e.preventDefault(); this.move(1); } };
    window.addEventListener('keydown', this.kd, true);
    this.iv = setInterval(() => this.measure(), 250); this.measure(true);
  }
  componentWillUnmount() { this.u && this.u(); window.removeEventListener('keydown', this.kd, true); clearInterval(this.iv); }
  target() {
    const sels = this.STEPS[M.S.tour.step][0].split('|');
    for (const s of sels) { const el = document.querySelector('[data-tour="' + s + '"]'); if (el) { const r = el.getBoundingClientRect(); if (r.width > 0 && r.height > 0) return el; } }
    return null;
  }
  measure(scroll) {
    if (!M.S.tour) return;
    const el = this.target(); const root = document.querySelector('[data-app-root]');
    if (!el || !root) { if (this.state.r) this.setState({ r: null }); return; }
    const k = M._scale || 1;
    if (scroll) { let p = el.parentElement; while (p && p !== root) { const cs = getComputedStyle(p); if (/auto|scroll/.test(cs.overflowY) && p.scrollHeight > p.clientHeight) { const pr = p.getBoundingClientRect(), er = el.getBoundingClientRect(); if (er.top < pr.top || er.bottom > pr.bottom) p.scrollTop += (er.top - pr.top) / k - 16; break; } p = p.parentElement; } }
    const rr = root.getBoundingClientRect(); const r = el.getBoundingClientRect();
    const n = { x: (r.left - rr.left) / k, y: (r.top - rr.top) / k, w: r.width / k, h: Math.min(r.height / k, rr.height / k - 24) };
    const o = this.state.r; if (!o || Math.abs(o.x - n.x) + Math.abs(o.y - n.y) + Math.abs(o.w - n.w) + Math.abs(o.h - n.h) > 1) this.setState({ r: n });
  }
  move(d) { const s = M.S.tour.step + d; if (s < 0) return; if (s >= this.STEPS.length) return this.end(); M.set({ tour: { step: s } }); setTimeout(() => { this.measure(true); this.nextRef.current && this.nextRef.current.focus(); }, 30); }
  end() { M.set({ tour: null }); M.toast('Tour finished. Replay it from your profile menu.'); }
  renderVals() {
    const S = M.S; if (!S.tour) return {};
    const i = S.tour.step; const [_, title, body] = this.STEPS[i]; const r = this.state.r; const phone = S.vw < 640;
    const W = S.vw, Hh = S.vh || 800; const pw = Math.min(320, W - 24);
    let popStyle;
    if (phone) popStyle = 'position:absolute; left:0; right:0; bottom:0; pointer-events:auto; display:flex; flex-direction:column; gap:6px; padding:16px 16px calc(16px + env(safe-area-inset-bottom)); border-radius:14px 14px 0 0; background:var(--color-surface-raised); box-shadow:var(--elevation-2)';
    else {
      let x, y;
      if (!r) { x = (W - pw) / 2; y = Hh / 2 - 90; }
      else {
        const below = r.y + r.h + 12, above = r.y - 12 - 190, right = r.x + r.w + 12;
        if (r.w < 280 && right + pw < W - 12) { x = right; y = Math.max(12, Math.min(Hh - 210, r.y)); }
        else if (below + 190 < Hh) { x = r.x; y = below; } else if (above > 12) { x = r.x; y = above; } else { x = r.x + 16; y = r.y + 16; }
        x = Math.max(12, Math.min(W - pw - 12, x));
      }
      popStyle = 'position:absolute; left:' + x + 'px; top:' + y + 'px; width:' + pw + 'px; pointer-events:auto; display:flex; flex-direction:column; gap:6px; padding:16px; border-radius:10px; border:1px solid var(--color-border); background:var(--color-surface-raised); box-shadow:var(--elevation-2)';
    }
    return {
      swallow: e => e.stopPropagation(), hasTarget: !!r, noTarget: !r, hx: r ? r.x - 4 + 'px' : 0, hy: r ? r.y - 4 + 'px' : 0, hw: r ? r.w + 8 + 'px' : 0, hh: r ? r.h + 8 + 'px' : 0,
      popStyle, stepLabel: 'Step ' + (i + 1) + ' of ' + this.STEPS.length, title, body, canBack: i > 0, back: () => this.move(-1), next: () => this.move(1), skip: () => this.end(), nextRef: this.nextRef,
      nextLabel: i === this.STEPS.length - 1 ? 'Finish tour' : 'Next'
    };
  }
}
</script>
</body>
</html>
