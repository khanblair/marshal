# Restarts the dev daemon when a Go file changes. Used by `pnpm dev` and `pnpm dev:daemon`.
root = "."
tmp_dir = "tmp"

[build]
  cmd = "go build -o ./tmp/marshald ./cmd/marshald"
  bin = "./tmp/marshald"
  args_bin = ["--dev"]
  include_ext = ["go"]
  exclude_dir = ["tmp", "testdata"]
  exclude_regex = ["_test\\.go$"]
  delay = 300

[log]
  time = false

[misc]
  clean_on_exit = true
