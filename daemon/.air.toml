# Restarts the dev daemon when a Go file changes. Used by `pnpm dev` and `pnpm dev:daemon`.
root = "."
tmp_dir = "tmp"

[build]
  # The dev daemon is built next to the stub agent (`pnpm dev` builds it into dist/bin first), because
  # the daemon looks for the stub agent in its own folder.
  cmd = "go build -o ../dist/bin/marshald ./cmd/marshald"
  entrypoint = ["../dist/bin/marshald"]
  args_bin = ["--dev", "--fixture", "prototype"]
  include_ext = ["go"]
  exclude_dir = ["tmp", "testdata"]
  exclude_regex = ["_test\\.go$"]
  delay = 300

[log]
  time = false

[misc]
  clean_on_exit = true
