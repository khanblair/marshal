name: e2e (macOS)

# The browser suite on macOS. It runs only after the main `ci` run has passed on `main`, and never
# on a pull request, because macOS minutes cost more than Linux ones.
#
# To run it by hand: Actions, "e2e (macOS)", Run workflow.
# To stop it: delete this file, or open it in the Actions tab and choose "Disable workflow".
on:
  workflow_run:
    workflows: [ci]
    types: [completed]
    branches: [main]
  workflow_dispatch:

jobs:
  e2e:
    name: e2e (macos, phone, tablet, desktop)
    if: github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success'
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # The commit that `ci` just passed, not whatever `main` has moved on to.
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - uses: actions/setup-go@v5
        with:
          go-version-file: daemon/go.mod
          cache-dependency-path: |
            daemon/go.sum
            tools/*/go.sum
      - uses: actions/cache@v4
        with:
          path: .tools
          key: go-tools-${{ runner.os }}-${{ hashFiles('scripts/setup-tools.mjs') }}
      - run: pnpm setup:tools
      - run: pnpm gen
      - run: pnpm --filter web exec playwright install --with-deps chromium
      - run: pnpm build
      - run: pnpm test:e2e
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: e2e-macos-report
          path: |
            apps/web/test-results/
            apps/web/playwright-report/
