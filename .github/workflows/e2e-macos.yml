name: e2e (macOS)

# Optional extra macOS browser run. Required browser coverage is already the final CI job.
# Run this manually when investigating browser behavior specific to macOS.
on:
  workflow_dispatch:

jobs:
  e2e:
    name: e2e (macos, phone, tablet, desktop)
    runs-on: macos-15-intel
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - uses: actions/setup-go@v5
        with:
          go-version-file: daemon/go.mod
          cache-dependency-path: |
            daemon/go.sum
            tools/*/go.sum
      - uses: actions/cache@v4
        with:
          path: .tools
          key: go-tools-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('scripts/setup-tools.mjs') }}
      - run: pnpm setup:tools
      - run: pnpm gen
      - run: pnpm --filter web exec playwright install --with-deps chromium
      - run: pnpm build
      - run: pnpm test:e2e
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: e2e-macos-report
          path: |
            apps/web/test-results/
            apps/web/playwright-report/
