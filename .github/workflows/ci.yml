name: ci

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  # The light checks run first, on one Linux runner, so a formatting, type, or generated-file
  # problem stops the run before the slow job (and the macOS minutes) is spent. This job is only a
  # tool runner, so it stays on Linux, where it is cheapest.
  lint:
    timeout-minutes: 25
    name: light checks (generated files, format, lint, types, smells, contrast)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - uses: actions/setup-go@v5
        with:
          go-version-file: daemon/go.mod
          cache-dependency-path: |
            daemon/go.sum
            tools/*/go.sum
      - uses: actions/cache@v4
        with:
          path: .tools
          key: go-tools-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('scripts/setup-tools.mjs') }}
      - run: pnpm setup:tools
      - run: pnpm gen
      # Generated files must be committed as `pnpm gen` makes them.
      - run: node scripts/check-generated.mjs --committed
      - run: pnpm format:check
      - run: pnpm lint
      - run: pnpm typecheck
      - name: Release ordering regressions
        run: node --test apps/desktop/scripts/release-plan.test.mjs
      - name: Fast card and mobile regressions
        run: |
          node --test apps/mobile/scripts/patch-android.test.mjs
          pnpm --filter web exec vitest run --coverage.enabled=false src/views/card/CardHeader.test.tsx src/views/card/SessionSettings.test.tsx src/views/card/DiffTab.test.tsx src/views/card/PreviewTab.daemon.test.tsx src/views/card/details-collapsed.test.ts src/views/card/preview-link.test.ts src/features/chat/agent-activity.test.ts src/platform/native-system-bars.test.ts
      - name: Fast runtime and preview regressions
        working-directory: daemon
        run: node ../scripts/go-tool.mjs go test -timeout 2m ./internal/agents/catalog ./internal/tailnet ./internal/previewrelay
      - run: pnpm smells
      - run: pnpm --filter @marshal/tokens check:contrast

  # The slow checks, once the light ones have passed. Marshal is macOS first, so only macOS runs
  # them for now. To test Linux or Windows again, add `ubuntu-latest` or `windows-latest` to the list.
  check:
    timeout-minutes: 60
    name: check (${{ matrix.os }})
    needs: lint
    strategy:
      fail-fast: false
      matrix:
        # The ARM pool failed to acquire a runner before any steps could start.
        # Keep the required macOS check on the standard Intel pool.
        os: [macos-15-intel]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - uses: actions/setup-go@v5
        with:
          go-version-file: daemon/go.mod
          cache-dependency-path: |
            daemon/go.sum
            tools/*/go.sum
      - uses: actions/cache@v4
        id: go-tools
        with:
          path: .tools
          key: go-tools-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('scripts/setup-tools.mjs') }}
      - run: pnpm setup:tools
      # Save successful tool setup before tests run. Failed test jobs used to discard this
      # cache, rebuilding every Go tool on the next macOS run.
      - name: Cache installed Go tools
        if: steps.go-tools.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: .tools
          key: go-tools-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('scripts/setup-tools.mjs') }}
      - run: pnpm gen
      # The daemon's tests write its coverage profile, and the web app and UI package tests fail
      # when they are below their floors. The next step checks the daemon against its floors.
      - run: pnpm test
        env:
          # Race-instrumented API and storage suites both create databases and subprocesses.
          # Bound concurrent Go packages on the standard runner; keep checks and deadlines.
          GOFLAGS: -p=2
      - run: node scripts/coverage.mjs
      - run: pnpm build
      # The budget says to watch the idle daemon for 60 seconds.
      - run: pnpm budgets
        env:
          MARSHAL_BUDGET_IDLE: 60s

  e2e:
    timeout-minutes: 30
    name: e2e (phone, tablet, desktop)
    runs-on: ubuntu-latest
    needs: check
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - uses: actions/setup-go@v5
        with:
          go-version-file: daemon/go.mod
          cache-dependency-path: |
            daemon/go.sum
            tools/*/go.sum
      - uses: actions/cache@v4
        with:
          path: .tools
          key: go-tools-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('scripts/setup-tools.mjs') }}
      - run: pnpm setup:tools
      - run: pnpm gen
      - run: pnpm --filter web exec playwright install --with-deps chromium
      - run: pnpm build
      - run: pnpm test:e2e
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: e2e-report
          path: |
            apps/web/test-results/
            apps/web/playwright-report/

  summary:
    timeout-minutes: 5
    name: Explain CI result and release gate
    if: always()
    needs: [lint, check, e2e]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/github-script@v7
        env:
          CHECK_RESULTS: ${{ toJSON(needs) }}
        with:
          script: |
            const checks = JSON.parse(process.env.CHECK_RESULTS);
            const rows = Object.entries(checks).map(([name, job]) => [name, job.result]);
            const passed = Object.values(checks).every(job => job.result === 'success');
            await core.summary.addHeading('CI and release order')
              .addTable([[{data: 'Stage', header: true}, {data: 'Result', header: true}], ...rows])
              .addRaw(passed
                ? 'CI passed. The release workflow will check .github/release.json and build an unpublished requested version automatically.'
                : 'Release is blocked. Fix the failed stage above and push again; skipped downstream jobs are expected.')
              .write();
