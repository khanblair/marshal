name: ci

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  # This workflow is the release gate: the light checks and every client test. It is kept fast on
  # purpose. The slow macOS tests and the browser tests run beside it in ci-full.yml and do not
  # block a release. The light checks run on one Linux runner, where a runner is cheapest.
  lint:
    timeout-minutes: 25
    name: light checks (generated files, format, lint, types, smells, contrast)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - uses: actions/setup-go@v5
        with:
          go-version-file: daemon/go.mod
          cache-dependency-path: |
            daemon/go.sum
            tools/*/go.sum
      - uses: actions/cache@v4
        with:
          path: .tools
          key: go-tools-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('scripts/setup-tools.mjs') }}
      - run: pnpm setup:tools
      - run: pnpm gen
      # Generated files must be committed as `pnpm gen` makes them.
      - run: node scripts/check-generated.mjs --committed
      - run: pnpm format:check
      - run: pnpm lint
      - run: pnpm typecheck
      - name: Release ordering regressions
        run: node --test apps/desktop/scripts/release-plan.test.mjs
      - name: Fast card and mobile regressions
        run: |
          node --test apps/mobile/scripts/patch-android.test.mjs
          pnpm --filter web exec vitest run --coverage.enabled=false src/views/card/CardHeader.test.tsx src/views/card/SessionSettings.test.tsx src/views/card/DiffTab.test.tsx src/views/card/PreviewTab.daemon.test.tsx src/views/card/details-collapsed.test.ts src/views/card/preview-link.test.ts src/features/chat/agent-activity.test.ts src/platform/native-system-bars.test.ts src/mock/index.test.ts src/styles/responsive-guards.test.ts
      - name: Fast runtime, limits, and preview regressions
        working-directory: daemon
        run: |
          node ../scripts/go-tool.mjs go test -timeout 2m ./internal/agents/catalog ./internal/harness ./internal/tailnet ./internal/previewrelay
          node ../scripts/go-tool.mjs go test -timeout 2m ./cmd/marshald -run '^TestDaemonKeychain'
      - run: pnpm smells
      - run: pnpm --filter @marshal/tokens check:contrast

  client-tests:
    name: client tests and coverage
    timeout-minutes: 20
    needs: lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # Protocol and UI indexes were already regenerated and checked by lint. Only token CSS
      # is untracked build output needed by these tests; no Go toolchain is needed here.
      - run: pnpm --filter @marshal/tokens gen
      - name: Test every client package with its existing coverage floors
        run: pnpm -r --filter web --filter @marshal/ui --filter @marshal/tokens --filter @marshal/protocol --filter desktop --filter mobile --workspace-concurrency=1 --if-present test

  summary:
    timeout-minutes: 5
    name: Explain CI result and release gate
    if: always()
    needs: [lint, client-tests]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/github-script@v7
        env:
          CHECK_RESULTS: ${{ toJSON(needs) }}
        with:
          script: |
            const checks = JSON.parse(process.env.CHECK_RESULTS);
            const rows = Object.entries(checks).map(([name, job]) => [name, job.result]);
            const passed = Object.values(checks).every(job => job.result === 'success');
            await core.summary.addHeading('CI and release order')
              .addTable([[{data: 'Stage', header: true}, {data: 'Result', header: true}], ...rows])
              .addRaw(passed
                ? 'CI passed. The release workflow will check .github/release.json and build an unpublished requested version automatically. The macOS and browser tests run in ci-full and do not block it.'
                : 'Release is blocked. Fix the failed stage above and push again; skipped downstream jobs are expected.')
              .write();
