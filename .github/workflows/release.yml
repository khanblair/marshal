# Builds the desktop shell (apps/desktop) on a GitHub-hosted macOS runner and publishes the
# result, so a signed .dmg never has to be built on the owner's own Mac.
#
# Triggers: pushing a tag that looks like a version ("v0.1.0"), or running this workflow by hand
# from the Actions tab with a "tag" input (useful to test the pipeline without cutting a real
# release; it still makes a draft release, which nobody sees until it is published).
#
# The build step is the same command a person runs locally (`pnpm --filter desktop build`,
# apps/desktop/package.json): this workflow only adds the environment Tauri's own macOS bundler
# reads to sign and notarize, rather than wrapping the build in a separate signing action. Code
# signing and notarization turn on automatically once these repository secrets exist (Settings ->
# Secrets and variables -> Actions), and the build stays ad-hoc signed (installable, but with a
# Gatekeeper "unidentified developer" prompt) when they do not:
#   APPLE_CERTIFICATE            Base64 of a Developer ID Application .p12 export
#   APPLE_CERTIFICATE_PASSWORD   The .p12's export password
#   APPLE_SIGNING_IDENTITY       The certificate's name, e.g. "Developer ID Application: ..."
#   APPLE_ID                     The Apple ID used for notarization
#   APPLE_PASSWORD                An app-specific password for that Apple ID (not its real one)
#   APPLE_TEAM_ID                 The Apple Developer team ID
#
# The Android job (apps/mobile) builds the phone app the same way, on a Linux runner, and attaches a
# signed .apk (direct install) and .aab (Google Play) to the same draft release. The phone app does
# not embed the web app or the daemon - it opens the page the daemon serves - so this job needs
# neither. It signs when these repository secrets exist, and leaves the build unsigned when they do
# not (an unsigned .apk cannot be installed, so the job says so instead of publishing one):
#   ANDROID_KEYSTORE_BASE64      Base64 of the upload keystore (.jks)
#   ANDROID_KEYSTORE_PASSWORD    The keystore's password
#   ANDROID_KEY_ALIAS            The key's alias inside it
#   ANDROID_KEY_PASSWORD         The key's password
name: release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "Version tag for this build (e.g. v0.1.0). Makes a draft release."
        required: true

permissions:
  contents: write

jobs:
  macos-dmg:
    name: macOS (dmg)
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Resolve the release tag
        id: tag
        run: echo "name=${{ github.event.inputs.tag || github.ref_name }}" >> "$GITHUB_OUTPUT"

      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile

      - uses: actions/setup-go@v5
        with:
          go-version-file: daemon/go.mod
          cache-dependency-path: |
            daemon/go.sum
            tools/*/go.sum
      - uses: actions/cache@v4
        with:
          path: .tools
          key: go-tools-${{ runner.os }}-${{ hashFiles('scripts/setup-tools.mjs') }}
      - run: pnpm setup:tools

      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: apps/desktop/src-tauri

      - name: Set the app's version from the release tag
        # tauri.conf.json's version ships as 0.0.1 in the repo; the tag is the real version. A
        # leading "v" in the tag (the usual form) is stripped, since Cargo and tauri.conf.json
        # both want a bare semver.
        run: |
          version="${{ steps.tag.outputs.name }}"
          version="${version#v}"
          node -e "
            const fs = require('node:fs');
            const path = 'apps/desktop/src-tauri/tauri.conf.json';
            const conf = JSON.parse(fs.readFileSync(path, 'utf8'));
            conf.version = '$version';
            fs.writeFileSync(path, JSON.stringify(conf, null, 2) + '\n');
          "

      # The daemon sidecar and the web app the daemon serves (internal/webui) both have to exist
      # before `tauri build` runs: the sidecar because tauri.conf.json's externalBin resolves it
      # at compile time (apps/desktop/src-tauri/build.rs fails loudly otherwise), the web app
      # because the daemon embeds whatever scripts/copy-web-dist.mjs finds in apps/web/dist.
      # `pnpm --filter desktop build` runs bundle-sidecar.mjs itself, which builds it and, the
      # first time apps/web/dist is missing, the web app too; running the web build explicitly
      # first just avoids relying on that fallback in CI.
      # Marshal's own Google OAuth client, so a person connects Google Calendar with one click. It is
      # a repository secret, never in git; the daemon embeds the file when it is built below. With no
      # secrets set the build has no Google client of its own, and Settings asks for one instead.
      - name: Put Marshal's own Google client in the build
        env:
          GOOGLE_CLIENT_ID: ${{ secrets.MARSHAL_GOOGLE_CLIENT_ID }}
          GOOGLE_CLIENT_SECRET: ${{ secrets.MARSHAL_GOOGLE_CLIENT_SECRET }}
        run: |
          if [ -n "$GOOGLE_CLIENT_ID" ] && [ -n "$GOOGLE_CLIENT_SECRET" ]; then
            node -e "require('fs').writeFileSync('daemon/internal/integrations/googleclient/files/client.json', JSON.stringify({clientId: process.env.GOOGLE_CLIENT_ID, clientSecret: process.env.GOOGLE_CLIENT_SECRET}))"
          else
            echo "No Google client secrets: this build has no built-in Google sign-in."
          fi

      - run: pnpm gen
      - run: pnpm --filter web build
      - run: node scripts/copy-web-dist.mjs

      - name: Build the signed app and dmg
        env:
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: pnpm --filter desktop build

      - name: Publish the draft release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.tag.outputs.name }}
          name: "Marshal ${{ steps.tag.outputs.name }}"
          body: "Built by this workflow from ${{ github.sha }}. See the commit log for what changed."
          draft: true
          files: |
            apps/desktop/src-tauri/target/release/bundle/dmg/*.dmg

  android:
    name: Android (apk, aab)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Resolve the release tag
        id: tag
        run: echo "name=${{ github.event.inputs.tag || github.ref_name }}" >> "$GITHUB_OUTPUT"

      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile

      # Gradle needs JDK 17, and the Rust side needs the Android NDK and the four Android targets.
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: android-actions/setup-android@v3
      - name: Install the NDK
        run: |
          # The platform and build tools the project needs are fetched by Gradle itself, since the
          # licences are already accepted; only the NDK has to be there before the Rust build.
          sdkmanager --install "ndk;27.2.12479018"
          echo "NDK_HOME=$ANDROID_HOME/ndk/27.2.12479018" >> "$GITHUB_ENV"
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android,armv7-linux-androideabi,i686-linux-android,x86_64-linux-android
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: apps/mobile/src-tauri

      - name: Set the app's version from the release tag
        # Same rule as the desktop job: the tag is the real version, without its leading "v".
        run: |
          version="${{ steps.tag.outputs.name }}"
          version="${version#v}"
          node -e "
            const fs = require('node:fs');
            const path = 'apps/mobile/src-tauri/tauri.conf.json';
            const conf = JSON.parse(fs.readFileSync(path, 'utf8'));
            conf.version = '$version';
            fs.writeFileSync(path, JSON.stringify(conf, null, 2) + '\n');
          "

      - name: Make the Android project and fit it to Marshal
        run: node apps/mobile/scripts/patch-android.mjs --init

      - name: Set up signing
        id: signing
        env:
          KEYSTORE: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          STORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          if [ -z "$KEYSTORE" ]; then
            echo "The Android signing secrets are not set, so this build is unsigned and will not be published."
            echo "signed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          android="apps/mobile/src-tauri/gen/android"
          echo "$KEYSTORE" | base64 --decode > "$RUNNER_TEMP/marshal.jks"
          {
            echo "storeFile=$RUNNER_TEMP/marshal.jks"
            echo "storePassword=$STORE_PASSWORD"
            echo "keyAlias=$KEY_ALIAS"
            echo "keyPassword=$KEY_PASSWORD"
          } > "$android/keystore.properties"
          echo "signed=true" >> "$GITHUB_OUTPUT"

      - name: Build the apk and aab
        run: pnpm --filter mobile exec tauri android build --apk --aab

      - name: Publish to the draft release
        if: steps.signing.outputs.signed == 'true'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.tag.outputs.name }}
          name: "Marshal ${{ steps.tag.outputs.name }}"
          draft: true
          files: |
            apps/mobile/src-tauri/gen/android/app/build/outputs/apk/universal/release/*.apk
            apps/mobile/src-tauri/gen/android/app/build/outputs/bundle/universalRelease/*.aab

      - name: Keep the unsigned build as a run artifact
        if: steps.signing.outputs.signed != 'true'
        uses: actions/upload-artifact@v4
        with:
          name: android-unsigned
          path: apps/mobile/src-tauri/gen/android/app/build/outputs/**/*
