name: release

# A successful CI completion is the event, not an agent polling GitHub.
# .github/release.json requests a version. Published versions are skipped.
on:
  workflow_run:
    workflows: [ci]
    types: [completed]
    branches: [main]
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing tag to retry. Its exact commit must have passed main CI."
        required: true
      target:
        description: "Build both platforms, or retry just one platform for this release tag."
        type: choice
        options: [all, desktop, android]
        default: all

permissions:
  contents: write
  actions: read

concurrency:
  group: marshal-release
  cancel-in-progress: false

jobs:
  prepare:
    timeout-minutes: 5
    name: Select verified release commit
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event.workflow_run.conclusion == 'success' &&
       github.event.workflow_run.event == 'push' &&
       github.event.workflow_run.head_repository.full_name == github.repository)
    runs-on: ubuntu-latest
    outputs:
      ready: ${{ steps.plan.outputs.ready }}
      sha: ${{ steps.plan.outputs.sha }}
      tag: ${{ steps.plan.outputs.tag }}
      target: ${{ steps.plan.outputs.target }}
      new-release: ${{ steps.plan.outputs.new-release }}
    steps:
      # Use the trusted default branch for orchestration, including retries of older tags.
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/github-script@v7
        id: plan
        env:
          REQUESTED_TAG: ${{ inputs.tag }}
          REQUESTED_TARGET: ${{ inputs.target || 'all' }}
        with:
          script: |
            const { planRelease } = await import(`${process.env.GITHUB_WORKSPACE}/apps/desktop/scripts/release-plan.mjs`);
            const plan = await planRelease({ github, context, tag: process.env.REQUESTED_TAG, target: process.env.REQUESTED_TARGET });
            core.setOutput('ready', String(plan.ready));
            if (plan.ready) {
              core.setOutput('sha', plan.sha);
              core.setOutput('tag', plan.tag);
              core.setOutput('target', plan.target);
              core.setOutput('new-release', String(plan.newRelease));
            }
            await core.summary.addHeading('Release order').addRaw(plan.ready
              ? `CI passed for ${plan.sha}. Build and verify both platforms, upload artifacts, then publish ${plan.tag}.`
              : plan.reason).write();

  macos-dmg:
    needs: prepare
    if: needs.prepare.outputs.ready == 'true' && needs.prepare.outputs.target != 'android'
    timeout-minutes: 90
    name: macOS (dmg)
    runs-on: macos-15-intel
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.prepare.outputs.sha }}
          fetch-depth: 0

      - name: Resolve the release tag
        id: tag
        env:
          RELEASE_TAG: ${{ needs.prepare.outputs.tag }}
        run: |
          node apps/desktop/scripts/prepare-release.mjs resolve-tag "$RELEASE_TAG" "$GITHUB_OUTPUT"
          # Release notes need a local tag. Only the final publish job creates it on GitHub.
          if ! git rev-parse --verify "refs/tags/$RELEASE_TAG" >/dev/null 2>&1; then
            git tag "$RELEASE_TAG"
          fi

      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile

      - uses: actions/setup-go@v5
        with:
          go-version-file: daemon/go.mod
          cache-dependency-path: |
            daemon/go.sum
            tools/*/go.sum
      - uses: actions/cache@v4
        with:
          path: .tools
          key: go-tools-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('scripts/setup-tools.mjs') }}
      - run: pnpm setup:tools

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin,x86_64-apple-darwin
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: apps/desktop/src-tauri
          cache-on-failure: true

      - name: Prepare signed updater config
        env:
          RELEASE_TAG: ${{ steps.tag.outputs.name }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
          MARSHAL_UPDATER_PUBLIC_KEY: ${{ vars.MARSHAL_UPDATER_PUBLIC_KEY }}
          MARSHAL_RELEASE_VERSION: ${{ steps.tag.outputs.version }}
        run: node apps/desktop/scripts/prepare-release.mjs config "$RELEASE_TAG" "$RUNNER_TEMP/marshal-tauri-release.json"

      # The daemon sidecar and the web app the daemon serves (internal/webui) both have to exist
      # before `tauri build` runs: the sidecar because tauri.conf.json's externalBin resolves it
      # at compile time (apps/desktop/src-tauri/build.rs fails loudly otherwise), the web app
      # because the daemon embeds whatever scripts/copy-web-dist.mjs finds in apps/web/dist.
      # `bundle-sidecar.mjs` builds and copies the web app before compiling the Go sidecars.
      # Marshal's own Google OAuth client, so a person connects Google Calendar with one click. It is
      # a repository secret, never in git; the daemon embeds the file when it is built below. With no
      # secrets set the build has no Google client of its own, and Settings asks for one instead.
      - name: Put Marshal's own Google client in the build
        env:
          GOOGLE_CLIENT_ID: ${{ secrets.MARSHAL_GOOGLE_CLIENT_ID }}
          GOOGLE_CLIENT_SECRET: ${{ secrets.MARSHAL_GOOGLE_CLIENT_SECRET }}
        run: |
          if [ -n "$GOOGLE_CLIENT_ID" ] && [ -n "$GOOGLE_CLIENT_SECRET" ]; then
            node -e "require('fs').writeFileSync('daemon/internal/integrations/googleclient/files/client.json', JSON.stringify({clientId: process.env.GOOGLE_CLIENT_ID, clientSecret: process.env.GOOGLE_CLIENT_SECRET}))"
          else
            echo "No Google client secrets: this build has no built-in Google sign-in."
          fi

      - run: pnpm gen

      - name: Build the signed app, updater archive, and dmg
        env:
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
          MARSHAL_RELEASE_VERSION: ${{ steps.tag.outputs.version }}
        run: |
          # Empty optional secrets must be absent, or Tauri attempts to import an empty certificate.
          for apple_setting in APPLE_CERTIFICATE APPLE_CERTIFICATE_PASSWORD APPLE_SIGNING_IDENTITY APPLE_ID APPLE_PASSWORD APPLE_TEAM_ID; do
            if [ -z "${!apple_setting}" ]; then unset "$apple_setting"; fi
          done
          node apps/desktop/scripts/bundle-sidecar.mjs --universal
          pnpm --filter desktop exec tauri build --ci --target universal-apple-darwin --config "$RUNNER_TEMP/marshal-tauri-release.json"

      - name: Verify the signed updater archive starts
        env:
          RELEASE_VERSION: ${{ steps.tag.outputs.version }}
        run: node apps/desktop/scripts/check-bundle.mjs --bundle-dir apps/desktop/src-tauri/target/universal-apple-darwin/release/bundle/macos --version "$RELEASE_VERSION" --universal

      - name: Generate updater manifest
        env:
          RELEASE_TAG: ${{ steps.tag.outputs.name }}
        run: node apps/desktop/scripts/prepare-release.mjs manifest "$RELEASE_TAG" apps/desktop/src-tauri/target/universal-apple-darwin/release/bundle/macos "$RUNNER_TEMP/latest.json"

      - name: Stage verified desktop downloads
        run: |
          mkdir -p "$RUNNER_TEMP/marshal-release-assets"
          cp apps/desktop/src-tauri/target/universal-apple-darwin/release/bundle/dmg/*.dmg "$RUNNER_TEMP/marshal-release-assets/"
          cp apps/desktop/src-tauri/target/universal-apple-darwin/release/bundle/macos/Marshal.app.tar.gz "$RUNNER_TEMP/marshal-release-assets/"
          cp apps/desktop/src-tauri/target/universal-apple-darwin/release/bundle/macos/Marshal.app.tar.gz.sig "$RUNNER_TEMP/marshal-release-assets/"
          cp "$RUNNER_TEMP/latest.json" "$RUNNER_TEMP/marshal-release-assets/"
      - uses: actions/upload-artifact@v4
        with:
          name: marshal-release-desktop
          path: ${{ runner.temp }}/marshal-release-assets/*
          if-no-files-found: error


  android:
    needs: prepare
    if: needs.prepare.outputs.ready == 'true' && needs.prepare.outputs.target != 'desktop'
    timeout-minutes: 60
    name: Android (apk, aab)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.prepare.outputs.sha }}

      - name: Resolve the release tag
        id: tag
        env:
          RELEASE_TAG: ${{ needs.prepare.outputs.tag }}
        run: |
          node apps/desktop/scripts/prepare-release.mjs resolve-tag "$RELEASE_TAG" "$GITHUB_OUTPUT"
          # Release notes need a local tag. Only the final publish job creates it on GitHub.
          if ! git rev-parse --verify "refs/tags/$RELEASE_TAG" >/dev/null 2>&1; then
            git tag "$RELEASE_TAG"
          fi

      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile

      # Gradle needs JDK 17, and the Rust side needs the Android NDK and the four Android targets.
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: android-actions/setup-android@v4
      - name: Install the NDK
        run: |
          # The platform and build tools the project needs are fetched by Gradle itself, since the
          # licences are already accepted; only the NDK has to be there before the Rust build.
          sdkmanager --install "ndk;27.2.12479018"
          echo "NDK_HOME=$ANDROID_HOME/ndk/27.2.12479018" >> "$GITHUB_ENV"
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android,armv7-linux-androideabi,i686-linux-android,x86_64-linux-android
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: apps/mobile/src-tauri

      - name: Set the app's version from the release tag
        # Same rule as the desktop job: the tag is the real version, without its leading "v".
        env:
          RELEASE_TAG: ${{ steps.tag.outputs.name }}
        run: node apps/desktop/scripts/prepare-release.mjs set-version "$RELEASE_TAG" apps/mobile/src-tauri/tauri.conf.json

      - name: Make the Android project and fit it to Marshal
        run: node apps/mobile/scripts/patch-android.mjs --init

      - name: Set up signing
        id: signing
        env:
          KEYSTORE: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          STORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          if [ -z "$KEYSTORE" ]; then
            echo "Android signing secrets are required for an installable release."
            exit 1
          fi
          android="apps/mobile/src-tauri/gen/android"
          echo "$KEYSTORE" | base64 --decode > "$RUNNER_TEMP/marshal.jks"
          {
            echo "storeFile=$RUNNER_TEMP/marshal.jks"
            echo "storePassword=$STORE_PASSWORD"
            echo "keyAlias=$KEY_ALIAS"
            echo "keyPassword=$KEY_PASSWORD"
          } > "$android/keystore.properties"
          echo "signed=true" >> "$GITHUB_OUTPUT"

      - name: Build the apk and aab
        run: pnpm --filter mobile exec tauri android build --apk --aab

      - name: Verify and prepare Android downloads
        if: steps.signing.outputs.signed == 'true'
        env:
          RELEASE_VERSION: ${{ steps.tag.outputs.version }}
        run: |
          set -euo pipefail
          apk_dir="apps/mobile/src-tauri/gen/android/app/build/outputs/apk/universal/release"
          bundle_dir="apps/mobile/src-tauri/gen/android/app/build/outputs/bundle/universalRelease"
          apksigner=$(find "$ANDROID_HOME/build-tools" -name apksigner -type f | sort -V | tail -n 1)
          test -n "$apksigner"
          mkdir -p dist/android
          apk_count=0
          for apk in "$apk_dir"/*.apk; do
            test -f "$apk"
            "$apksigner" verify --verbose "$apk"
            cp "$apk" "dist/android/Marshal_${RELEASE_VERSION}_universal.apk"
            apk_count=$((apk_count + 1))
          done
          test "$apk_count" -eq 1
          for bundle in "$bundle_dir"/*.aab; do
            test -f "$bundle"
            jarsigner -J-Duser.language=en -J-Duser.country=US -verify -verbose -certs "$bundle" > "$RUNNER_TEMP/aab-signature.txt"
            grep -Fxq 'jar verified.' "$RUNNER_TEMP/aab-signature.txt"
            cp "$bundle" "dist/android/Marshal_${RELEASE_VERSION}_universal.aab"
          done

      - uses: actions/upload-artifact@v4
        with:
          name: marshal-release-android
          path: dist/android/*
          if-no-files-found: error

  publish:
    timeout-minutes: 10
    name: Publish verified downloads together
    needs: [prepare, macos-dmg, android]
    if: >-
      always() && !cancelled() && needs.prepare.result == 'success' &&
      needs.prepare.outputs.ready == 'true' &&
      ((needs.macos-dmg.result == 'success' && needs.android.result == 'success') ||
       (needs.prepare.outputs.target == 'desktop' && needs.macos-dmg.result == 'success') ||
       (needs.prepare.outputs.target == 'android' && needs.android.result == 'success'))
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: marshal-release-*
          merge-multiple: true
          path: release-assets
      - name: Require the selected platform downloads
        env:
          RELEASE_TAG: ${{ needs.prepare.outputs.tag }}
          RELEASE_TARGET: ${{ needs.prepare.outputs.target }}
        run: |
          set -euo pipefail
          if [ "$RELEASE_TARGET" != android ]; then
            test -s release-assets/Marshal.app.tar.gz
            test -s release-assets/Marshal.app.tar.gz.sig
            test -s release-assets/latest.json
            test "$(find release-assets -maxdepth 1 -name '*.dmg' | wc -l)" -eq 1
          fi
          if [ "$RELEASE_TARGET" != desktop ]; then
            test -s "release-assets/Marshal_${RELEASE_TAG#v}_universal.apk"
            test -s "release-assets/Marshal_${RELEASE_TAG#v}_universal.aab"
          fi
      - name: Upload all downloads before making a new release public
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.prepare.outputs.tag }}
          target_commitish: ${{ needs.prepare.outputs.sha }}
          name: "Marshal ${{ needs.prepare.outputs.tag }}"
          body: "Built from CI-verified commit ${{ needs.prepare.outputs.sha }}."
          generate_release_notes: true
          draft: ${{ needs.prepare.outputs.new-release == 'true' }}
          make_latest: ${{ needs.prepare.outputs.new-release == 'true' && 'false' || 'legacy' }}
          fail_on_unmatched_files: true
          files: release-assets/*
      - name: Verify uploaded assets and publish
        uses: actions/github-script@v7
        env:
          RELEASE_TAG: ${{ needs.prepare.outputs.tag }}
          RELEASE_SHA: ${{ needs.prepare.outputs.sha }}
          NEW_RELEASE: ${{ needs.prepare.outputs.new-release }}
        with:
          script: |
            const fs = require('node:fs');
            // A draft has no tag yet, and the by-tag lookup never returns drafts, so list the releases.
            const releases = await github.paginate(github.rest.repos.listReleases, { ...context.repo, per_page: 100 });
            const release = releases.find(item => item.tag_name === process.env.RELEASE_TAG);
            if (!release) throw new Error(`No release or draft found for ${process.env.RELEASE_TAG}.`);
            // A draft records the commit it will tag. A published release already has its tag.
            const tagged = release.draft
              ? release.target_commitish
              : (await github.rest.repos.getCommit({ ...context.repo, ref: process.env.RELEASE_TAG })).data.sha;
            if (tagged !== process.env.RELEASE_SHA) throw new Error('Release tag changed since validation.');
            const { data: assets } = await github.rest.repos.listReleaseAssets({ ...context.repo, release_id: release.id, per_page: 100 });
            for (const name of fs.readdirSync('release-assets')) {
              const size = fs.statSync(`release-assets/${name}`).size;
              if (!assets.some(asset => asset.name === name && asset.size === size && asset.state === 'uploaded')) {
                throw new Error(`Release asset missing or incomplete: ${name}`);
              }
            }
            await github.rest.repos.updateRelease({ ...context.repo, release_id: release.id, draft: false,
              make_latest: process.env.NEW_RELEASE === 'true' ? 'true' : 'legacy' });
            await core.summary.addHeading('Release published').addLink(process.env.RELEASE_TAG, release.html_url).write();
