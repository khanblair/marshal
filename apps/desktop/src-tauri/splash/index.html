<!doctype html>
<!--
  Shown for the second or two between the window opening and the daemon answering its health
  route (daemon.rs). Not the app: once the daemon is up, main.rs navigates this window straight
  to the daemon's own address, and the daemon serves the real app from there (internal/webui).
-->
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Marshal</title>
    <link rel="stylesheet" href="theme.css" />
    <style>
      :root {
        color-scheme: light dark;
      }
      body {
        margin: 0;
        display: flex;
        align-items: center;
        justify-content: center;
        height: 100vh;
        font-family:
          -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        background: var(--color-canvas);
        color: var(--color-text-primary);
      }
      .wrap {
        text-align: center;
      }
      .spinner {
        width: 28px;
        height: 28px;
        margin: 0 auto 16px;
        border-radius: 50%;
        border: 3px solid var(--color-border);
        border-top-color: var(--color-ink);
        animation: spin 0.8s linear infinite;
      }
      @keyframes spin {
        to {
          transform: rotate(360deg);
        }
      }
      p {
        opacity: 0.7;
        font-size: 13px;
      }
    </style>
  </head>
  <body>
    <div class="wrap">
      <div class="spinner"></div>
      <p>Starting Marshal…</p>
    </div>
  </body>
</html>
